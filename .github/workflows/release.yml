name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published Release tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      VERIFY_GIT_TAGS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: hustcer/setup-moonbit@v1
        with:
          version: "0.10.4+2cc641edf"
          core-version: "0.10.4+2cc641edf"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Verify published Release, tag identity, and main ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --tags
          test "$(gh release view "$RELEASE_TAG" --json name --jq .name)" = "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "false"
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$tag_commit" origin/main

      - name: Verify MoonBit module
        run: |
          moon update
          moon version
          moon check --target js
          moon test
          moon info
          moon fmt
          git diff --check
          git diff --exit-code

      - name: Verify generated sources and release metadata
        run: |
          yarn check:generated
          yarn check:release

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Verify real-browser conformance
        run: yarn test:browser

      - name: Build browser demo
        run: yarn build

      - name: Rebuild and checksum MoonBit package
        run: |
          moon package --frozen --list
          cd _build/publish
          sha256sum ./*.zip > SHA256SUMS

      - name: Upload verified GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            _build/publish/*.zip \
            _build/publish/SHA256SUMS \
            --clobber

      - name: Read exact module version
        run: |
          module_version="$(sed -n 's/^version = "\(.*\)"/\1/p' moon.mod)"
          test "$RELEASE_TAG" = "v$module_version"
          echo "MODULE_VERSION=$module_version" >> "$GITHUB_ENV"

      - name: Check whether the exact registry version already passes
        id: registry
        run: |
          if node scripts/verify-published-package.mjs "$MODULE_VERSION" \
            > prepublish-verification.log 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
          cat prepublish-verification.log

      - name: Publish to mooncakes.io
        if: steps.registry.outputs.already_published != 'true'
        env:
          MOON_CREDENTIALS: ${{ secrets.MOON_CREDENTIALS }}
        run: |
          test -n "$MOON_CREDENTIALS"
          install -d -m 700 ~/.moon
          umask 077
          printf '%s' "$MOON_CREDENTIALS" > ~/.moon/credentials.json
          moon publish --frozen

      - name: Verify exact published version from a fresh downstream module
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "registry verification attempt $attempt/6" \
              | tee -a published-verification.log
            if node scripts/verify-published-package.mjs "$MODULE_VERSION" \
              2>&1 | tee -a published-verification.log; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          exit 1

      - name: Preserve registry verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mooncakes-${{ env.MODULE_VERSION }}-verification
          path: |
            prepublish-verification.log
            published-verification.log
          if-no-files-found: warn
