name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Moonbit
        uses: hustcer/setup-moonbit@v1
        with:
          version: "0.10.4+2cc641edf"
          core-version: "0.10.4+2cc641edf"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Check generated DOM helpers
        run: yarn check:generated

      - name: moon check
        run: moon update && moon version && moon check --target js

      - name: Check release metadata and package contents
        env:
          VERIFY_GIT_TAGS: "1"
        run: yarn check:release

      - name: Check generated interfaces
        run: |
          moon info
          git diff --exit-code -- src/pkg.generated.mbti src/main/pkg.generated.mbti src/main/streaming-test/pkg.generated.mbti

      - name: Check public API documentation
        run: yarn check:docs

      - name: moon test
        run: moon test

      - name: Server Web Stream conformance
        run: yarn test:server

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: yarn test:browser

      - name: Check formatting
        run: |
          moon fmt
          git diff --check
          git diff --exit-code

      - name: "compiles to js"
        run: yarn build

      # - name: moon bundle
      #   run: moon bundle

      # - name: check core size
      #   run: ls -alh `find ./target/bundle -name *.core`

      # - name: format diff
      #   run: |
      #     moon fmt
      #     git diff

      - name: Deploy to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deploy
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{secrets.rsync_private_key}}
        with:
          flags: "-avzr --progress"
          options: ""
          ssh_options: ""
          src: "dist/*"
          dest: "rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}"

      - name: Display status from deploy
        run: echo "${{ steps.deploy.outputs.status }}"
